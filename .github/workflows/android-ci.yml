name: Android build and tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 2: Setup Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Step 3: Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Step 4: Accept Android SDK licenses
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      # Step 5: Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # Step 6: Check project files
      - name: Check Gradle files
        run: |
          ls -la
          test -f settings.gradle -o -f settings.gradle.kts

      # Step 7: Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 8: Create debug signing key
      - name: Create local debug signing key
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Step 9: Run unit tests
      - name: Run unit tests
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew testDebugUnitTest --no-daemon
          else
            echo "Gradle wrapper not found"
            exit 1
          fi

      # Step 10: Build debug APK
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Step 11: Upload APK
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nayra-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
